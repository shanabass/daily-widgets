
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Morning Brief</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b1628;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
 line-height:1.5;
}

main{
 max-width:650px;
 margin:auto;
 padding:24px 18px 60px;
}

h1{font-size:29px;margin:8px 0}
h2{font-size:21px;margin-top:32px}

p{color:#cbd5e1}

.eyebrow{
 color:#80ded2;
 font-size:12px;
 letter-spacing:2px;
}

.date{
 color:#a7b7ce;
 font-size:13px;
}

.card{
 background:#16253b;
 border:1px solid #293b55;
 border-radius:16px;
 padding:17px;
 margin:13px 0;
}

.source{
 color:#80ded2;
 font-size:12px;
}

.card h3{
 font-size:17px;
 margin:9px 0;
}

.card p{
 font-size:14px;
 margin:8px 0;
}

a{
 color:#80ded2;
 font-size:13px;
}

button{
 background:#80ded2;
 color:#102032;
 border:0;
 padding:12px 16px;
 border-radius:10px;
 font-weight:700;
 font-size:14px;
 cursor:pointer;
}

button.secondary{
 background:#263c57;
 color:#fff;
}

button:disabled{
 opacity:.75;
 cursor:default;
}

.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:15px;
}

.option{
 display:block;
 width:100%;
 margin:9px 0;
 text-align:left;
 background:#263c57;
 color:#fff;
 font-weight:400;
 line-height:1.5;
}

.option.correct{
 background:#216a56;
 border:1px solid #55c59e;
}

.option.wrong{
 background:#773d45;
 border:1px solid #e28b94;
}

.feedback{
 font-size:14px;
 margin-top:13px;
 line-height:1.6;
}

.small{
 font-size:12px;
 color:#9fb1c8;
}

.category{
 color:#80ded2;
 font-size:12px;
 margin-bottom:8px;
}

.result{
 text-align:center;
 padding:24px 16px;
}

.score{
 font-size:36px;
 font-weight:800;
 color:#80ded2;
 margin:10px 0;
}

.progress{
 font-size:13px;
 color:#a7b7ce;
 margin:12px 0;
}

.hidden{
 display:none;
}
</style>
</head>

<body>
<main>

<div class="eyebrow">
 YOUR DAILY WORLD UPDATE
</div>

<h1>🌍 The Morning Brief</h1>

<div class="date" id="date"></div>

<p>
 L'essentiel de l'actualité mondiale,
 à lire ou à écouter.
</p>

<div class="actions">
 <button onclick="speakBrief()">
  🎧 Écouter le briefing
 </button>

 <button class="secondary" onclick="stopBrief()">
  Arrêter
 </button>
</div>

<h2>📰 À la une</h2>

<div id="news">
 Chargement des actualités...
</div>

<h2>🧠 Le quiz du jour</h2>

<p>
 5 questions de culture générale pour apprendre
 quelque chose de nouveau chaque jour.
</p>

<div id="quiz">
 Chargement du quiz...
</div>

<p class="small" id="quizUpdated"></p>
<p class="small" id="updated"></p>

</main>

<script>

const DATA_URL =
 "https://raw.githubusercontent.com/shanabass/daily-widgets/main/data/news.json";

let headlines = [];
let questions = [];
let score = 0;
let answered = 0;
let answeredQuestions = new Set();

const escapeHTML = value =>
 String(value ?? "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#39;");

document.getElementById("date").textContent =
 new Date().toLocaleDateString("fr-FR",{
  weekday:"long",
  day:"numeric",
  month:"long",
  year:"numeric"
 });

async function loadNews(){

 try{

  const response = await fetch(
   DATA_URL + "?t=" + Date.now(),
   {cache:"no-store"}
  );

  if(!response.ok){
   throw new Error("HTTP " + response.status);
  }

  const data = await response.json();

  headlines = (data.headlines || [])
   .filter(item => item.title);

  renderNews();

  renderQuiz(data.quiz || []);

  if(data.updated_at){
   document.getElementById("updated").textContent =
    "Dernière collecte des actualités : " +
    new Date(data.updated_at)
     .toLocaleString("fr-FR");
  }

  if(data.quiz_updated_at){
   document.getElementById("quizUpdated").textContent =
    "Quiz actualisé le " +
    new Date(data.quiz_updated_at)
     .toLocaleString("fr-FR");
  }

 }catch(error){

  document.getElementById("news").textContent =
   "Impossible de charger les actualités : " +
   error.message;

  document.getElementById("quiz").textContent =
   "Impossible de charger le quiz pour le moment.";

 }

}

function renderNews(){

 const container = document.getElementById("news");

 if(!headlines.length){
  container.textContent =
   "Aucune actualité disponible pour le moment.";
  return;
 }

 container.innerHTML =
  headlines.slice(0,10).map((item,i)=>`

   <article class="card">

    <div class="source">
     ${escapeHTML(item.source || "Actualité")}
     · ${i+1}
    </div>

    <h3>
     ${escapeHTML(item.title)}
    </h3>

    <p>
     ${escapeHTML(
      item.summary ||
      item.description ||
      "Description indisponible."
     )}
    </p>

    ${
     item.url &&
     /^https?:\/\//i.test(item.url)
     ? `
      <a
       href="${escapeHTML(item.url)}"
       target="_blank"
       rel="noopener noreferrer"
      >
       Consulter la source
      </a>
     `
     : ""
    }

   </article>

  `).join("");

}

function renderQuiz(rawQuestions){

 const container = document.getElementById("quiz");

 questions = rawQuestions.filter(q =>
  q.question &&
  Array.isArray(q.options) &&
  q.options.length >= 2 &&
  typeof q.answer === "string" &&
  q.options.includes(q.answer)
 ).slice(0,5);

 score = 0;
 answered = 0;
 answeredQuestions = new Set();

 if(!questions.length){

  container.innerHTML = `
   <div class="card">
    <p>
     Le quiz du jour n'est pas encore disponible.
     Reviens un peu plus tard !
    </p>
   </div>
  `;

  return;
 }

 container.innerHTML =

  `<div class="progress" id="progress">
    0 / ${questions.length} questions répondues
   </div>` +

  questions.map((q,i)=>`

   <div class="card" id="question-${i}">

    <div class="category">
     ${escapeHTML(
      q.category || "Culture générale"
     )}
    </div>

    <strong>
     ${i+1}. ${escapeHTML(q.question)}
    </strong>

    <div id="options-${i}">

     ${q.options.map((option,j)=>`

      <button
       class="option"
       data-q="${i}"
       data-o="${j}"
      >
       ${escapeHTML(option)}
      </button>

     `).join("")}

    </div>

    <div
     class="feedback"
     id="feedback-${i}"
     aria-live="polite"
    ></div>

   </div>

  `).join("") +

  `<div class="card result" id="result">

    <strong>
     Ton score apparaîtra ici !
    </strong>

    <p>
     Réponds aux ${questions.length} questions
     pour découvrir ton résultat.
    </p>

   </div>`;

 document.querySelectorAll(".option")
  .forEach(button=>{

   button.addEventListener("click",()=>{

    answerQuestion(
     Number(button.dataset.q),
     Number(button.dataset.o)
    );

   });

  });

}

function answerQuestion(i,j){

 if(answeredQuestions.has(i)){
  return;
 }

 const q = questions[i];

 if(!q || j < 0 || j >= q.options.length){
  return;
 }

 answeredQuestions.add(i);

 const chosen = q.options[j];
 const correct = chosen === q.answer;

 if(correct){
  score++;
 }

 answered++;

 const container =
  document.getElementById("options-"+i);

 const buttons =
  container.querySelectorAll("button");

 buttons.forEach((button,index)=>{

  button.disabled = true;

  if(q.options[index] === q.answer){
   button.classList.add("correct");
  }

  else if(index === j){
   button.classList.add("wrong");
  }

 });

 const feedback =
  document.getElementById("feedback-"+i);

 const message = correct
  ? "✅ Bonne réponse !"
  : "❌ Pas tout à fait !";

 feedback.innerHTML = `

  <strong>${message}</strong>

  <p>
   Bonne réponse :
   <strong>${escapeHTML(q.answer)}</strong>
  </p>

  <p>
   ${escapeHTML(
    q.explanation ||
    "Une nouvelle connaissance à retenir !"
   )}
  </p>

 `;

 document.getElementById("progress").textContent =
  answered + " / " + questions.length +
  " questions répondues";

 if(answered === questions.length){
  showResult();
 }

}

function showResult(){

 const total = questions.length;

 let message = "";

 if(score === total){
  message =
   "Excellent ! Un sans-faute aujourd'hui ! 🏆";
 }

 else if(score >= Math.ceil(total * 0.6)){
  message =
   "Très bien ! Tu enrichis ta culture générale ! 🌟";
 }

 else{
  message =
   "Chaque question est une occasion d'apprendre ! 📚";
 }

 document.getElementById("result").innerHTML = `

  <h3>🎯 Ton résultat</h3>

  <div class="score">
   ${score} / ${total}
  </div>

  <p>${message}</p>

  <p>
   Rendez-vous demain pour
   cinq nouvelles questions !
  </p>

  <button onclick="restartQuiz()">
   🔄 Refaire le quiz
  </button>

 `;

}

function restartQuiz(){

 const savedQuestions = [...questions];

 renderQuiz(savedQuestions);

 document.getElementById("quiz")
  .scrollIntoView({
   behavior:"smooth",
   block:"start"
  });

}

function speakBrief(){

 if(!("speechSynthesis" in window)){

  alert(
   "La lecture vocale n'est pas disponible sur ce navigateur."
  );

  return;
 }

 if(!headlines.length){

  alert(
   "Le briefing n'est pas encore chargé."
  );

  return;
 }

 stopBrief();

 const script = headlines.slice(0,8)
  .map((item,i)=>

   "Actualité " + (i+1) + ". " +
   item.title + ". " +
   (item.summary || item.description || "")

  ).join(". ");

 const utterance =
  new SpeechSynthesisUtterance(
   "Bonjour ! Voici The Morning Brief. " +
   script
  );

 utterance.lang = "fr-FR";
 utterance.rate = 0.9;

 window.speechSynthesis.speak(utterance);

}

function stopBrief(){

 if("speechSynthesis" in window){
  window.speechSynthesis.cancel();
 }

}

loadNews();

</script>
</body>
</html>
